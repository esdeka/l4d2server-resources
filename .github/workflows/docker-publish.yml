name: Publish Docker image

on:
  push:
    branches:
      - master
    paths:
      - .gitignore
      - Dockerfile
      - docker-compose.yml
      - resources/root/autoupdate.txt
      - resources/root/runServer_.sh
      - resources/root/start.sh
      - resources/root/workshop.py
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: echo "image_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/esdeka/l4d2serverresources:latest
            ghcr.io/esdeka/l4d2serverresources:${{ steps.tags.outputs.image_date }}
